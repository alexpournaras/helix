  - id: uro.flank_pain_with_fever
    area: urinary_genital
    level: urgent
    title: Pain in the side or lower back with a fever (possible kidney infection)
    fires:
      all:
        - text:
            - '(?:flank|loin|kidney) pain'
            - 'pain in (?:my |the )?(?:side|flank|loin|lower back|back)'
            - 'side (?:pain|hurts)'
            - '(?:back|side) (?:is )?(?:hurting|aching)'
        - text: *FEVER
    rule_out_question: Do you have pain in your side or back together with a fever or shivering?
    sources: [nhs_kidney_infection]
    examples:
      fires:
        - text: Burning when I pee, pain in my side and a fever.
      no_fire:
        - text: Pain in my side when I twist, no fever.

  # ---------------- Eye ----------------
  - id: eye.painful_red_eye_with_vision_change
    area: eye
    level: emergency
    title: A painful red eye with blurred or reduced vision, halos, or pain from light
    fires:
      all:
        - text:
            - 'eye pain'
            - 'painful eye'
            - '(?:eye|eyes) (?:is |are |really )?(?:hurts?|hurting|painful|sore|aching)'
            - 'pain in (?:my |the |his |her )?eye'
            - 'red eye'
            - '(?:eye|eyes) (?:is |are )?(?:red|bloodshot)'
        - any:
            - mention: *VISION
            - mention:
                - 'halos?'
                - 'rainbows? around lights'
            - mention:
                - 'light hurts'
                - 'sensitiv\w* to (?:the )?light'
                - 'photophob\w*'
    unknown: vision_change
    rule_out_question: Has your vision become blurred or reduced, do you see halos around lights, or does light hurt the eye?
    sources: [nhs_red_eye, nhs_glaucoma]
    examples:
      fires:
        - text: My eye is red and painful and my vision is blurry.
      no_fire:
        - text: My eye is red and itchy. My vision is not blurry. I see no halos. I am not sensitive to light.
      unknown:
        - text: I have a painful eye since yesterday.

  - id: eye.chemical_exposure
    area: eye
    level: emergency
    title: A chemical in the eye
    fires:
      all:
        - text:
            - 'eyes?'
        - text:
            - 'chemical\w*'
            - 'bleach'
            - 'acid'
            - 'alkali'
            - 'cleaning (?:product|fluid|spray)'
            - 'cement'
            - 'oven cleaner'
            - 'drain cleaner'
            - 'splash\w*'
    rule_out_question: Has any chemical splashed into the eye?
    sources: [nhs_eye_injuries]
    examples:
      fires:
        - text: Bleach splashed into my eye a few minutes ago.
      no_fire:
        - text: My eyes are tired from reading.

  - id: eye.flashes_floaters_curtain
    area: eye
    level: emergency
    title: New flashes or floaters with a shadow or curtain over the vision (possible retinal detachment)
    fires:
      any:
        - text:
            - '(?:curtain|shadow|veil)\W+(?:\w+\W+){0,4}(?:vision|sight|eye)'
        - all:
            - text:
                - 'flash\w*(?: of light| lights)?'
                - 'floaters?'
                - 'spots in (?:my |the )?vision'
            - mention:
                - 'curtain'
                - 'shadow'
                - 'veil'
                - 'dark (?:area|patch|shape)'
                - '(?:missing|lost) part of (?:my )?vision'
    unknown: visual_field_loss
    rule_out_question: Along with the flashes or floaters, is there a dark shadow or curtain over part of your vision?
    sources: [nhs_flashes_floaters, nhs_retinal_detachment]
    examples:
      fires:
        - text: I see flashes and now a dark curtain over part of my vision.
      no_fire:
        - text: I have had the same few floaters for years. No shadow or curtain.
      unknown:
        - text: I have noticed new floaters this week.

  # ---------------- Ear, nose and throat ----------------
  - id: ent.stridor
    area: ent
    level: emergency
    title: Noisy, high-pitched breathing in (stridor)
    fires:
      text:
        - stridor
        - high[- ]pitched (?:sound|noise|whistl\w*|squeak\w*) (?:when|while|as) (?:breathing|breathes|breathing in|they breathe|he breathes|she breathes)
        - struggling to breathe in
        - harsh (?:sound|noise) (?:when|while) breathing in
    rule_out_question: Is there a high-pitched or harsh noise when breathing in?
    sources: [nhs_croup, nhs_epiglottitis]
    examples:
      fires:
        - text: My child makes a high-pitched noise when breathing in.
      no_fire:
        - text: He has a barking cough during the day but breathes quietly.

  - id: ent.drooling_unable_to_swallow
    area: ent
    level: emergency
    title: Drooling or unable to swallow saliva with a sore throat or fever
    fires:
      any:
        - text:
            - '(?:can''?t|cannot|unable to) swallow (?:my |his |her |their )?(?:own )?(?:spit|saliva|anything|liquids|water)'
        - all:
            - text:
                - 'drool\w*'
            - text:
                - 'sore throat'
                - 'throat (?:pain|hurts)'
                - 'swallow\w*'
                - 'fever\w*'
                - 'high temperature'
    rule_out_question: Is the person drooling or unable to swallow their own saliva?
    sources: [nhs_epiglottitis, nhs_sore_throat]
    examples:
      fires:
        - text: She has a very sore throat, is drooling and has a fever.
        - text: I can't swallow my own saliva.
      no_fire:
        - text: My baby is teething and drooling, no fever, feeding fine.

  - id: ent.sudden_hearing_loss
    area: ent
    level: emergency
    title: Sudden hearing loss
    fires:
      any:
        - all:
            - text:
                - '(?:can''?t|cannot|unable to) hear (?:anything|properly|much)?\W*(?:\w+\W+){0,3}ears?'
                - (?:hearing|ear) (?:is |went |has gone )?(?:muffled|blocked|dead|deaf)
            - text:
                - sudden\w*
                - overnight
                - woke up
                - (?:since|from) (?:this morning|last night|yesterday|today)
        - text:
            - sudden\w* (?:hearing loss|loss of hearing|deaf\w*)
            - sudden\w* lost (?:my |the |his |her )?hearing
            - lost (?:my |the |his |her )?hearing (?:in (?:one|my left|my right|the left|the right) ear )?(?:suddenly|overnight)
            - woke up (?:deaf|unable to hear|with (?:no|muffled|reduced) hearing)
            - (?:hearing|ear) (?:went|has gone|suddenly went) (?:deaf|dead|muffled|quiet)
    rule_out_question: Did you lose hearing suddenly, over hours to a few days?
    sources: [nice_ng98_hearing_loss, nhs_hearing_loss]
    examples:
      fires:
        - text: I woke up with muffled hearing in my right ear.
        - text: Yesterday I suddenly lost hearing in my left ear.
      no_fire:
        - text: My hearing has slowly got worse in both ears over ten years.

  - id: ent.facial_weakness
    area: ent
    level: emergency
    title: New weakness or drooping of one side of the face
    fires:
      text:
        - facial (?:weakness|droop|paralysis|palsy)
        - (?:face|mouth|smile) (?:is |has )?(?:drooping|droop\w*|paraly\w*|fallen)
        - one side of (?:my |the |his |her )?face (?:is |has )?(?:droop\w*|weak|paraly\w*|fallen)
        - (?:can'?t|cannot) (?:close|shut) (?:my |his |her |one )?eye
    rule_out_question: Has one side of the face become weak or droopy, or can one eye not close?
    sources: [nhs_bells_palsy, nhs_stroke_symptoms]
    examples:
      fires:
        - text: Since this morning one side of my face is drooping and I can't close my eye.
      no_fire:
        - text: My face feels puffy in the morning.

  - id: ent.pulsatile_tinnitus
    area: ent
    level: routine_review  # NICE NG155 1.2.7: consider referral through local pathways
    title: Pulsatile tinnitus (a sound in the ear in time with the heartbeat)
    fires:
      text:
        - pulsatile tinnitus
        - (?:tinnitus|ringing|whooshing|noise|sound|thumping) (?:that )?(?:beats|pulses|pulsing|throbs|throbbing|thumps)
        - (?:in time|in sync|synchroni[sz]ed) with (?:my )?(?:heart\w*|pulse)
        - (?:hear|hearing) (?:my )?(?:heartbeat|pulse|heart beat)
        - (?:heartbeat|pulse) in (?:my )?ears?
        - whoosh\w* (?:sound|noise|in (?:my )?ears?)
    rule_out_question: Does the sound beat or whoosh in time with your heartbeat?
    sources: [nice_ng155_tinnitus, nhs_tinnitus]
    examples:
      fires:
        - text: I hear a whooshing sound in my ear in time with my heartbeat.
      no_fire:
        - text: I have a constant high-pitched ringing in both ears after concerts.

  - id: ent.one_sided_progressive_hearing_loss
    area: ent
    level: urgent
    title: Hearing loss or tinnitus in one ear that is getting worse
    fires:
      all:
        - text:
            - 'hearing (?:loss|is going|getting worse|worse)'
            - 'losing (?:my )?hearing'
            - '(?:can''?t|cannot) hear (?:as )?well'
            - 'deaf\w*'
            - 'tinnitus'
            - 'ringing'
        - text:
            - 'one ear'
            - 'one side'
            - '(?:left|right) ear'
            - 'only (?:in|on) (?:my |the )?(?:left|right)'
            - 'one[- ]sided'
            - 'unilateral'
        - text:
            - 'getting worse'
            - 'worsening'
            - 'gradual\w*'
            - 'progress\w*'
            - 'over (?:the )?(?:past |last )?(?:months|weeks|year)'
    rule_out_question: Is the hearing loss or ringing only in one ear, and has it been getting worse?
    sources: [nice_ng98_hearing_loss, nice_ng155_tinnitus, nhs_acoustic_neuroma]
    examples:
      fires:
        - text: The hearing in my right ear has been getting worse over months, with ringing on that side.
      no_fire:
        - text: Ringing in both ears after a loud concert last night.

  # ---------------- Skin ----------------
  - id: skin.spreading_rash_with_fever_or_blisters
