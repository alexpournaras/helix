  # ---------------- Hormones and metabolism ----------------
  - id: meta.diabetes_vomiting_abdominal_pain
    area: hormones_metabolism
    level: emergency
    title: Vomiting with abdominal pain, ketones or fruity breath in someone with diabetes (possible DKA)
    fires:
      all:
        - any:
            - fact: diabetes
              eq: true
              missing: false
            - text: *DIABETES
        - any:
            - all:
                - text:
                    - 'vomit\w*'
                    - 'being sick'
                    - 'throwing up'
                    - 'threw up'
                - text: *ABDO
            - text:
                - 'ketones? (?:are |is )?(?:high|positive|raised)'
                - 'high ketones'
                - 'fruity (?:breath|smell)'
                - '(?:smell|smells) (?:of )?pear drops'
                - 'breath smells (?:sweet|fruity)'
    unknown: diabetes
    rule_out_question: Do you have diabetes, and if so are your ketones raised?
    sources: [nhs_dka, nice_ng17_type1_diabetes, nice_ng18_diabetes_children]
    examples:
      fires:
        - text: I have type 1 diabetes and I am vomiting with stomach pain.
        - text: Vomiting and tummy ache since this morning.
          facts: {diabetes: true}
      no_fire:
        - text: Vomiting and tummy ache after bad food.
        - text: I have diabetes and my sugars are stable, no vomiting.

  - id: meta.very_high_blood_sugar
