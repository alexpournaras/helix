# Universal safety floor (PLAN B7.1, 1B.1). The most safety-critical curated asset.
#
# Each rule: id, area, level (emergency / urgent / routine_review), population, title, `fires` (conditions, see
# knowledge/conditions.py), `unknown` (what to ask about when the rule is unknown), rule_out_question, sources
# (ids in knowledge/sources.yaml) and examples. The examples are the rule's unit tests: `fires` must fire, `no`
# must not, `unknown` must come out unknown (so the rule-out question is asked).
#
# Patterns are regexes on the English text, case-insensitive, whole words, negation-aware ("no chest pain" does
# not match). `mention` = a feature a triage nurse would ask about: never mentioned → unknown → ask.
#
# DRAFTED BY AN AGENT (2026-11-24) from NHS and NICE guidance. Not yet reviewed by clinicians (PLAN Part G.6:
# two reviewers, recorded in docs/decisions.md). Until then `review.status` stays `unreviewed` and pre-flight
# warns. The rules err on the side of asking or escalating.
version: 1
review:
  status: unreviewed
  reviewers: []
  notes: Agent draft from NHS and NICE pages listed in sources.yaml. Needs two human reviewers, ideally clinicians.

_fragments:
  chest: &CHEST
    - chest (?:pain|pains|tightness|pressure|discomfort|ache|heaviness)
    - (?:pain|pains|tightness|pressure|heaviness|ache) (?:in|across|on) (?:my|the|his|her|their) chest
    - chest (?:hurts|is hurting|feels (?:tight|heavy|crushed))
    - '(?:pain|pains|tight\w*|pressure|heav\w*|ache|aching|discomfort|crushing|squeez\w*)\W+(?:\w+\W+){0,5}chest'
    - 'chest\W+(?:\w+\W+){0,3}(?:pain|pains|hurts|hurting|tight\w*|pressure|heavy|aches?|aching)'
  breathless: &BREATHLESS
    - short(?:ness)? of breath
    - breathless\w*
    - can'?t (?:catch (?:my|his|her) )?breath(?:e)?
    - cannot breathe
    - struggling to breathe
    - (?:difficulty|trouble|problems?) breathing
    - hard to breathe
    - out of breath
  fever: &FEVER
    - (?<!hay )fever\w*
    - (?:feels?|felt|is|was|seems?|feeling) (?:very |really |so )?hot
    - burning up
    - high temperature
    - '(?:temperature|temp) (?:of |is |was |at |reading )?(?:3[89]|4[01])(?:\.\d)?'
    - (?:shivering|shivers|rigors|chills)
    - hot to (?:the )?touch
  abdo: &ABDO
    - (?:stomach|abdominal|abdomen|belly|tummy) (?:pain|ache|cramps?|hurts)
    - pain in (?:my|the|his|her) (?:stomach|abdomen|belly|tummy|lower belly)
    - '(?:pain|ache|cramps?|hurts?)\W+(?:\w+\W+){0,4}(?:stomach|abdomen|belly|tummy|pelvis)'
    - (?:stomach|tummy|belly) (?:is )?(?:really )?(?:hurting|sore)
    - cramps? in (?:my |the |his |her )?(?:lower )?(?:stomach|belly|tummy|abdomen)
  confusion: &CONFUSION
    - (?:sudden(?:ly)? )?confus\w*
    - disorientat\w*
    - not making (?:any )?sense
    - (?:does ?n'?t|didn'?t) (?:know|recognise|recognize) (?:where|who)
    - (?:talking|speaking) nonsense
  diabetes_text: &DIABETES
    - diabet\w*
    - type 1
    - type one
    - insulin
  head_hit: &HEADHIT
    - (?:hit|banged|bumped|knocked|struck) (?:my|his|her|their|the) head
    - head injury
    - (?:knock|blow|bang) (?:on|to) the head
    - concussion
    - fell (?:and|then) hit
  vision_change: &VISION
    - blurr\w*
    - vision (?:is )?(?:loss|lost|worse|changed|reduced|cloudy|dim)
    - can'?t see (?:properly|clearly|well)
    - lost (?:my |some )?(?:vision|sight)

rules:
  # ---------------- Heart, lungs, allergy ----------------
  - id: heart.chest_pain_red_features
    area: heart_lungs_allergy
    level: emergency
    title: Chest pain with breathlessness, sweating, sickness or pain spreading to the arm, jaw, neck or back
    fires:
      all:
        - text: *CHEST
        - any:
            - mention: *BREATHLESS
            - mention:
                - 'sweat\w*'
                - 'clammy'
                - 'cold sweat'
            - mention:
                - '(?:spread\w*|going|radiat\w*|moving) (?:to|into|down) (?:my |the |his |her )?(?:left |right )?(?:arm|arms|jaw|neck|back|shoulder)'
                - '(?:arm|jaw|neck) (?:pain|hurts|aches)'
            - mention:
                - '(?:feel|feeling|felt) sick'
                - 'nause\w*'
                - 'vomit\w*'
            - mention:
                - 'crushing'
                - 'heavy'
                - 'like (?:a|an) (?:weight|elephant)'
    unknown: chest_pain_features
    rule_out_question: With the chest pain, are you short of breath, sweating, feeling sick, or does the pain feel heavy or spread to your arm, jaw, neck or back?
    sources: [nhs_chest_pain, nhs_heart_attack, nice_cg95_chest_pain]
    examples:
      fires:
        - text: I have chest pain and I am sweating a lot.
        - text: Tightness in my chest that spreads to my left arm.
        - text: My chest hurts and I feel short of breath.
      no_fire:
        - text: My knee hurts when I climb stairs.
        - text: I have chest pain when I press on one rib. I am not short of breath. I am not sweating. I don't feel sick. It is not heavy. It does not spread to my arm.
      unknown:
        - text: I have had some chest pain since this morning.

  - id: lungs.sudden_severe_breathlessness
    area: heart_lungs_allergy
    level: emergency
    title: Sudden or severe breathlessness, or blue lips
    fires:
      any:
        - text:
            - struggling to breathe
            - can'?t breathe
            - cannot breathe
            - gasping for (?:air|breath)
            - blue lips
            - lips (?:are |turning |have gone )?blue
            - too breathless to (?:speak|talk)
            - can'?t (?:speak|talk) in (?:full )?sentences
        - all:
            - text:
                - 'sudden\w*'
                - 'all of a sudden'
            - text: *BREATHLESS
    rule_out_question: Did the breathlessness come on suddenly, or is it so bad you can't finish a sentence?
    sources: [nhs_shortness_of_breath, nhs_pulmonary_embolism]
    examples:
      fires:
        - text: I suddenly became very short of breath an hour ago.
        - text: She is struggling to breathe and her lips look blue.
      no_fire:
        - text: I get a bit out of breath after running for a long time.
        - text: No breathing problems at all.

  - id: heart.pulmonary_embolism_signs
    area: heart_lungs_allergy
    level: emergency
    title: Breathlessness or chest pain with a painful or swollen leg
    fires:
      all:
        - text:
            - '(?:calf|leg) (?:is )?(?:pain|painful|swollen|swelling|tender|red|warm)'
            - '(?:pain|swelling) in (?:my|one|the) (?:calf|leg)'
            - '(?:swollen|painful) (?:calf|leg)'
        - any:
            - text: *BREATHLESS
            - text: *CHEST
            - text:
                - 'cough\w* (?:up )?blood'
    rule_out_question: Along with the leg pain or swelling, are you short of breath or do you have chest pain?
    sources: [nhs_pulmonary_embolism, nhs_dvt]
    examples:
      fires:
        - text: My left calf is swollen and painful and now I am short of breath.
      no_fire:
        - text: My calf is sore after football. My breathing is fine and I have no chest pain.

  - id: allergy.anaphylaxis
    area: heart_lungs_allergy
    level: emergency
    title: Signs of anaphylaxis (swelling of the lips, tongue or throat, or a reaction with breathing problems or faintness)
    fires:
      any:
        - text:
            - anaphyla\w*
            - (?:lips|tongue|throat|face) (?:is |are |started |starting )?(?:to )?swell\w*
            - swell\w* (?:of|in) (?:my|the|his|her) (?:lips|tongue|throat|face)
            - swollen (?:lips|tongue|throat|face)
            - throat (?:is |feels )?(?:closing|tight\w*)
            - '(?:throat|airway)\W+(?:\w+\W+){0,4}(?:closing|tight\w*|swell\w*)'
        - all:
            - text:
                - 'rash'
                - 'hives'
                - 'itch\w*'
                - 'allerg\w*'
                - 'stung'
                - 'sting'
                - '(?:ate|eaten|eating) (?:a )?(?:peanuts?|nuts?|shellfish)'
            - any:
                - text: *BREATHLESS
                - text:
                    - 'wheez\w*'
                    - 'faint\w*'
                    - 'dizzy'
                    - 'light ?headed'
                    - 'collaps\w*'
    rule_out_question: Is there any swelling of the lips, tongue or throat, wheezing, trouble breathing, or feeling faint?
    sources: [nhs_anaphylaxis, nice_cg134_anaphylaxis]
    examples:
      fires:
        - text: After eating peanuts my lips started to swell.
        - text: I was stung by a wasp, I have hives everywhere and I feel faint.
      no_fire:
        - text: I have mild hay fever with an itchy nose in spring.
        - text: My skin is itchy but there is no swelling and no trouble breathing.

  - id: heart.fainting_with_cardiac_features
    area: heart_lungs_allergy
    level: emergency
    title: Fainting with chest pain, palpitations or during exercise
    fires:
      all:
        - text:
            - 'faint\w*'
            - 'passed out'
            - 'blacked out'
            - 'collapsed'
            - 'lost consciousness'
            - '(?:lose|losing) consciousness'
        - any:
            - mention: *CHEST
            - mention:
                - 'palpitation\w*'
                - 'heart (?:was |is )?(?:racing|pounding|fluttering|skipping|beating fast)'
                - 'racing heart'
                - 'irregular heartbeat'
            - mention:
                - '(?:during|while|when) (?:exercis\w*|running|exertion|sport|playing)'
    unknown: syncope_features
    rule_out_question: Before fainting, did you have chest pain or a racing or irregular heartbeat, or did it happen during exercise?
    sources: [nhs_fainting, nice_cg109_tloc]
    examples:
      fires:
        - text: I passed out while running and my heart was racing before.
      no_fire:
        - text: I felt faint once after standing up quickly in a hot room. No chest pain, no palpitations, not during exercise.
      unknown:
        - text: I fainted yesterday at home.

  - id: lungs.coughing_blood
    area: heart_lungs_allergy
    level: urgent
    title: Coughing up blood
    fires:
      text:
        - cough\w* (?:up )?(?:blood|bloody)
        - blood (?:in|with) (?:my |the )?(?:phlegm|sputum|spit|mucus)
        - bloody (?:phlegm|sputum|mucus)
        - ha?emoptysis
    rule_out_question: Have you coughed up any blood?
    sources: [nhs_coughing_blood, nice_ng12_cancer]
    examples:
      fires:
        - text: For a week I have been coughing up blood in the mornings.
      no_fire:
        - text: I have a dry cough but no blood.

  - id: lungs.coughing_a_lot_of_blood
    area: heart_lungs_allergy
    level: emergency
    title: Coughing up a lot of blood
    fires:
      all:
        - text:
            - 'cough\w* (?:up )?(?:a lot of |lots of |large amounts? of )?(?:blood|bloody)'
        - text:
            - 'a lot of blood'
            - 'lots of blood'
            - 'large amount'
            - 'cupful'
            - '(?:won''?t|will not|does ?n''?t) stop'
            - 'clots?'
    rule_out_question: Is it a lot of blood, or does the bleeding not stop?
    sources: [nhs_coughing_blood]
    examples:
      fires:
        - text: I am coughing up a lot of blood and it won't stop.
      no_fire:
        - text: There were small streaks of blood when I coughed once.

  - id: lungs.new_exertional_breathlessness
    area: heart_lungs_allergy
    level: urgent
    title: New breathlessness on exertion
    fires:
      all:
        - text: *BREATHLESS
        - text:
            - 'walking'
            - 'stairs'
            - 'exercis\w*'
            - 'exertion'
            - 'climbing'
            - 'any activity'
            - '(?:at|after) the slightest'
            - 'hills?'
    rule_out_question: Do you get breathless with activity you could manage before, such as walking or stairs?
    sources: [nhs_shortness_of_breath]
    examples:
      fires:
        - text: Lately I get breathless climbing the stairs, which never happened before.
      no_fire:
        - text: I have no breathing problems on the stairs.

  # ---------------- Brain and nerves ----------------
  - id: neuro.stroke_signs
    area: brain_nerves
    level: emergency
    title: Signs of a stroke (face drooping, arm weakness, speech problems)
    fires:
      text:
        - (?:face|mouth|smile) (?:is |has )?(?:drooping|droop\w*|fallen|dropped)
        - droop\w* (?:face|mouth|smile|eyelid)
        - one side of (?:my |the |his |her |their )?face (?:is |has )?(?:droop\w*|weak|numb|fallen|gone)
        - slurr\w* (?:speech|words)
        - speech (?:is |was |became )?slurr\w*
        - (?:can'?t|cannot|unable to) (?:speak|talk|find (?:my|the) words)
        - sudden\w* (?:weak\w*|numb\w*) (?:in|on|of)
        - (?:weakness|numbness) (?:in|of|on) (?:one|my left|my right|the left|the right|his left|his right|her left|her right) (?:arm|leg|side|hand)
        - (?:arm|leg|hand|face) (?:went|is|feels|suddenly|has gone|suddenly went) (?:weak|numb|dead|heavy)
        - (?:can'?t|cannot) get (?:my|the|his|her|their) words out
        - words (?:are |came out |coming out )?(?:jumbled|muddled|wrong|garbled)
        - '(?:can''?t|cannot) (?:lift|raise) (?:my|his|her|one)(?: left| right)? arm'
    rule_out_question: Has any part of the face drooped, has an arm or leg gone weak or numb, or has speech become slurred or difficult?
    sources: [nhs_stroke_symptoms, nice_ng128_stroke]
    examples:
      fires:
        - text: His face is drooping on one side and his speech is slurred.
        - text: I suddenly can't lift my right arm.
      no_fire:
        - text: My arm is sore after the vaccine.
        - text: There is no weakness and my speech is normal.

  - id: neuro.thunderclap_headache
    area: brain_nerves
    level: emergency
    title: Sudden severe ("thunderclap") or worst-ever headache
    fires:
      all:
        - text:
            - 'headaches?'
            - 'head (?:pain|ache)'
        - text:
            - worst (?:headache|pain) (?:of|in) my life
            - worst (?:headache )?ever
            - thunderclap
            - (?:came|come|comes) on (?:suddenly|in (?:a few )?seconds|instantly|all at once)
            - (?:sudden\w*|instant\w*) (?:and )?(?:very )?(?:severe|excruciating|unbearable|blinding)
            - like (?:being )?(?:hit|kicked|struck) (?:on|in) the head
            - explo(?:ded|sive|sion)
    rule_out_question: Did the headache come on suddenly and reach full strength within seconds or a minute, or is it the worst you have ever had?
    sources: [nhs_headaches, nice_ng128_stroke]
    examples:
      fires:
        - text: The worst headache of my life came on suddenly while lifting.
        - text: I had a sudden severe headache like being hit on the head.
      no_fire:
        - text: I get a dull headache most afternoons after screen work.

  - id: neuro.seizure_first_or_prolonged
    area: brain_nerves
    level: emergency
    title: A first seizure, or a seizure lasting more than 5 minutes or without recovery
    fires:
      all:
        - text:
            - 'seizures?'
            - 'convuls\w*'
            - '(?:had|having|has) (?:a )?fits?'
            - 'fitting'
            - 'epileptic (?:fit|attack)'
        - any:
            - mention:
                - 'first (?:ever|time|one|seizure)'
                - 'never (?:had|happened) (?:one |a seizure |this )?before'
            - mention:
                - '(?:more than|over|longer than) (?:5|five) minutes'
                - '(?:won''?t|didn''?t|did not|will not) stop'
                - 'one after (?:another|the other)'
                - '(?:not|hasn''?t|has not|didn''?t) (?:woken|waking|woke) up'
                - '(?:still )?unconscious'
    unknown: seizure_history
    rule_out_question: Was this a first seizure, did it last more than 5 minutes, or has the person not fully woken up afterwards?
    sources: [nhs_epilepsy, nice_ng217_epilepsy]
    examples:
      fires:
        - text: My son had a seizure for the first time today.
        - text: She has been having a fit for more than 5 minutes.
      no_fire:
        - text: I am fit and healthy and run every day.
        - text: He has known epilepsy. It was not his first seizure, it lasted one minute, it did not go on longer than 5 minutes and he recovered fully.
      unknown:
        - text: I think I had a seizure last night.

  - id: neuro.new_confusion
    area: brain_nerves
    level: emergency
    title: New or sudden confusion
    fires:
      text: *CONFUSION
    rule_out_question: Has the person become confused, disoriented or hard to understand recently?
    sources: [nhs_confusion, nice_cg103_delirium]
    examples:
      fires:
        - text: Since this morning my husband is suddenly confused and doesn't know where he is.
      no_fire:
        - text: I am not confused, just tired.

  - id: neuro.meningitis_signs
    area: brain_nerves
    level: emergency
    title: Headache with fever and a stiff neck, dislike of light, or a rash
    fires:
      all:
        - text:
            - 'headaches?'
            - 'head (?:pain|ache)'
        - text: *FEVER
        - any:
            - mention:
                - 'stiff neck'
                - 'neck (?:is |feels )?stiff'
                - '(?:can''?t|cannot) (?:bend|touch|move) (?:my |his |her )?(?:neck|chin)'
            - mention:
                - 'light hurts'
                - 'sensitiv\w* to (?:the )?light'
                - 'photophob\w*'
                - '(?:bright )?lights? (?:hurts?|bothers?)'
            - mention:
                - 'rash'
                - 'spots'
                - 'blotches'
    unknown: meningitis_features
    rule_out_question: With the headache and fever, is there a stiff neck, does light hurt the eyes, or is there any rash?
    sources: [nhs_meningitis, nice_ng240_meningitis]
    examples:
      fires:
        - text: She has a headache, a high temperature and a stiff neck.
      no_fire:
        - text: I have a headache but no fever.
        - text: Headache and fever with a cold. No stiff neck. I am not sensitive to light. There is no rash.
      unknown:
        - text: I have a bad headache and a fever since last night.

  - id: neuro.sudden_vision_loss_or_double_vision
    area: brain_nerves
    level: emergency
    title: Sudden loss of vision or sudden double vision
    fires:
      text:
        - sudden\w* (?:loss of|lost) (?:my |his |her |the )?(?:vision|sight)
        - (?:went|gone|going) blind
        - (?:can'?t|cannot) see (?:out of|with) (?:one|my left|my right|his left|his right|her left|her right) eye
        - sudden\w* (?:double|blurred) vision
        - (?:double|blurred) vision (?:came on )?sudden\w*
        - seeing double sudden\w*
        - vision (?:suddenly )?(?:went|blacked|turned) (?:black|dark|out)
    rule_out_question: Have you suddenly lost vision in one or both eyes, or suddenly started seeing double?
    sources: [nhs_vision_loss, nhs_double_vision]
    examples:
      fires:
        - text: This morning I suddenly lost the vision in my left eye.
        - text: I have sudden double vision since an hour ago.
      no_fire:
        - text: My reading vision has been getting slowly worse over years.

  - id: neuro.cauda_equina
    area: brain_nerves
    level: emergency
    title: Back pain with numbness around the genitals or bottom, bladder or bowel problems, or weakness in both legs (cauda equina)
    fires:
      all:
        - text:
            - 'back pain'
            - 'backache'
            - 'sciatica'
            - '(?:pain|ache) in (?:my |his |her )?(?:lower )?back'
            - '(?:lower )?back (?:hurts|is hurting|is sore)'
        - any:
            - mention:
                - 'numb\w* (?:around|between|in|of) (?:my |the |his |her )?(?:genitals|bottom|buttocks|groin|anus|inner thighs|saddle)\w*'
                - 'saddle (?:numbness|an(?:a)?esthesia)'
            - mention:
                - '(?:can''?t|cannot|unable to|difficulty|trouble|problems?) (?:pee|peeing|urinat\w*|passing urine|control\w* (?:my |the )?(?:bladder|bowels?))'
                - '(?:lost|loss of|losing) (?:bladder|bowel) control'
                - 'wet (?:myself|the bed)'
                - 'incontinen\w*'
            - mention:
                - 'both legs (?:are |feel |have gone )?(?:weak|numb)'
                - '(?:weakness|numbness) in (?:both|my) legs'
    unknown: saddle_bladder_symptoms
    rule_out_question: Do you have numbness around your genitals or bottom, any new problem controlling your bladder or bowels, or weakness or numbness in both legs?
    sources: [nhs_back_pain, nhs_sciatica]
    examples:
      fires:
        - text: I have severe back pain and numbness around my bottom.
        - text: Lower back pain and since yesterday I can't control my bladder.
      no_fire:
        - text: My back hurts after gardening. No numbness around the bottom or genitals. No trouble controlling my bladder or bowels. No weakness in my legs.
      unknown:
        - text: I have had lower back pain for two days.

  - id: neuro.progressive_weakness_or_numbness
    area: brain_nerves
    level: urgent
    title: New weakness or numbness that is getting worse
    fires:
      all:
        - text:
            - 'weak\w*'
            - 'numb\w*'
            - 'tingl\w*'
            - 'pins and needles'
        - text:
            - 'getting worse'
            - 'worsening'
            - 'spreading'
            - 'progress\w*'
            - 'more and more'
            - 'every day'
    rule_out_question: Is the weakness or numbness spreading or getting worse?
    sources: [nhs_numbness, nhs_stroke_symptoms]
    examples:
      fires:
        - text: The numbness in my feet is spreading up my legs.
      no_fire:
        - text: My foot went numb for a minute after sitting cross-legged.

  # ---------------- Infection and sepsis ----------------
  - id: sepsis.red_flags
    area: infection_sepsis
    level: emergency
    title: Possible sepsis (fever or infection with confusion, mottled or blue skin, very fast breathing, a non-blanching rash or no urine)
    fires:
      all:
        - text:
            - 'fever\w*'
            - 'high temperature'
            - '(?:shivering|shivers|rigors|chills)'
            - 'infect\w*'
            - 'very cold'
        - any:
            - text:
                - 'confus\w*'
                - 'slurr\w*'
                - 'not making sense'
                - '(?:very )?drowsy'
                - 'hard to wake'
            - text:
                - 'mottled'
                - 'blotchy skin'
                - '(?:skin|lips|tongue) (?:is |are |looks? )?(?:blue|grey|gray|pale)'
            - text:
                - 'breathing (?:very )?(?:fast|quickly)'
                - 'fast breathing'
                - '(?:very )?breathless'
            - text:
                - 'non[- ]?blanching'
                - '(?:rash|spots) (?:that )?(?:does ?n''?t|do ?n''?t|won''?t|did ?n''?t) (?:fade|go away)'
            - text:
                - '(?:haven''?t|hasn''?t|not) (?:peed|urinated|passed (?:any )?urine)'
                - 'no urine'
    rule_out_question: With the fever or infection, is there confusion, mottled or bluish skin, very fast breathing, a rash that doesn't fade when pressed, or no urine for a day?
    sources: [nhs_sepsis, nice_ng51_sepsis]
    examples:
      fires:
        - text: He has a high temperature and is confused and breathing very fast.
        - text: Fever with shivering and her skin looks mottled.
      no_fire:
        - text: I have a mild fever with a runny nose and feel otherwise fine.

  - id: sepsis.fever_infant_under_3_months
    area: infection_sepsis
    level: emergency
    population: infant
    title: Fever in a baby under 3 months
    fires:
      all:
        - text: *FEVER
        - fact: age_months
          lt: 3
    unknown: age_months
    rule_out_question: How old is the baby? Is the baby under 3 months?
    sources: [nhs_fever_children, nice_ng143_fever_under5]
    examples:
      fires:
        - text: My baby has a fever of 38.2.
          facts: {age_months: 2}
      no_fire:
        - text: My baby has a fever of 38.2.
          facts: {age_months: 8}
        - text: My baby is feeding well and has no fever.
          facts: {age_months: 2}
      unknown:
        - text: The baby feels hot to the touch.

  - id: sepsis.fever_immunocompromised
    area: infection_sepsis
    level: emergency
    population: immunocompromised
    title: Fever during chemotherapy or while immunosuppressed
    fires:
      text: *FEVER
    unknown: immunocompromised
    rule_out_question: Are you having chemotherapy or taking medicines that weaken the immune system?
    sources: [nice_ng51_sepsis, nhs_chemotherapy]
    examples:
      fires:
        - text: I have a temperature of 38.5 tonight.
          facts: {chemotherapy: true}
      no_fire:
        - text: I have a temperature of 38.5 tonight.
          facts: {immunocompromised: false}
      unknown:
        - text: I have a temperature of 38.5 tonight.

  - id: infection.persistent_high_fever
    area: infection_sepsis
    level: urgent
    title: A high temperature that lasts several days or won't come down
    fires:
      all:
        - text: *FEVER
        - text:
            - (?:for|over|more than) (?:3|three|4|four|5|five|several|a few) days
            - (?:3|three|4|four|5|five) days (?:of|with|now)
            - (?:won'?t|will not|does ?n'?t|is not|isn'?t) (?:go|come|coming|going) down
            - keeps coming back
    rule_out_question: Has the high temperature lasted more than 3 days, or does it not come down with usual measures?
    sources: [nhs_high_temperature, nhs_fever_children]
    examples:
      fires:
        - text: I have had a fever for 5 days and it won't come down.
      no_fire:
        - text: I had a fever yesterday and today it is gone.

  # ---------------- Abdomen and gut ----------------
  - id: gut.severe_pain_rigid_abdomen
    area: abdomen_gut
    level: emergency
    title: Severe abdominal pain with a rigid or very tender abdomen, or sudden severe abdominal pain
    fires:
      all:
        - text: *ABDO
        - any:
            - text:
                - 'rigid'
                - 'hard as a board'
                - 'board[- ]like'
                - '(?:tummy|stomach|belly|abdomen) (?:is |feels )?(?:very )?(?:hard|tight|swollen)'
                - 'hurts to (?:move|cough|walk)'
                - '(?:can''?t|cannot) (?:move|stand up straight)'
            - all:
                - text:
                    - 'severe'
                    - 'unbearable'
                    - 'excruciating'
                    - 'worst'
                    - 'agony'
                    - 'agonising'
                - text:
                    - 'sudden\w*'
                    - 'all of a sudden'
    rule_out_question: Is the pain severe and sudden, is the abdomen hard or very tender, or does it hurt to move or cough?
    sources: [nhs_stomach_ache, nhs_appendicitis]
    examples:
      fires:
        - text: Sudden severe stomach pain and my belly feels hard.
        - text: Pain in my lower belly, it hurts to walk or cough.
      no_fire:
        - text: Mild tummy ache after a big meal that passed in an hour.

  - id: gut.vomiting_blood_or_black_stools
    area: abdomen_gut
    level: emergency
    title: Vomiting blood or black, tarry stools
    fires:
      text:
        - vomit\w* (?:up )?(?:blood|bloody)
        - throw\w* up blood
        - (?:blood|bloody) (?:in|with) (?:my |the |his |her )?vomit
        - coffee[- ]grounds?
        - black (?:tarry |sticky )?(?:poo|poos|stool|stools)
        - tarry (?:poo|stool|stools)
        - mela?ena
        - (?:poo|poos|stool|stools) (?:is |are |has been |have been |look |looks |are very )?(?:black|tarry)
        - ha?ematemesis
    rule_out_question: Have you vomited blood or something like coffee grounds, or passed black, tarry stools?
    sources: [nhs_vomiting_blood, nhs_rectal_bleeding]
    examples:
      fires:
        - text: This morning I was vomiting blood.
        - text: My stools have been black and tarry for two days.
      no_fire:
        - text: I vomited twice after bad food but there was no blood.

  - id: gut.abdominal_pain_possible_pregnancy
    area: abdomen_gut
    level: emergency
    title: Abdominal or pelvic pain when pregnant or possibly pregnant (ectopic pregnancy)
    fires:
      all:
        - text:
            - (?:stomach|abdominal|abdomen|belly|tummy|pelvic|pelvis) (?:pain|ache|cramps?)
            - pain in (?:my|the) (?:stomach|abdomen|belly|tummy|lower belly|pelvis)
            - pain (?:on|in) (?:one|my left|my right) side
            - shoulder tip pain
            - '(?:pain|ache|cramps?|hurts?)\W+(?:\w+\W+){0,4}(?:stomach|abdomen|belly|tummy|pelvis)'
            - cramps? in (?:my |the )?(?:lower )?(?:stomach|belly|tummy|abdomen|pelvis)
        - fact: sex
          ne: male
          missing: true
        - any:
            - fact: pregnant
              eq: true
            - text:
                - 'missed (?:my )?period'
                - 'period\W+(?:\w+\W+){0,3}late'
                - '(?:might|could) be pregnant'
                - 'positive (?:pregnancy )?test'
                - '(?:I''?m|I am) pregnant'
    unknown: pregnancy_possible
    rule_out_question: Could you be pregnant, for example a missed or late period or a positive test?
    sources: [nhs_ectopic, nice_ng126_ectopic]
    examples:
      fires:
        - text: Pain in my lower belly on one side and my period is late.
          facts: {sex: female, age_years: 27}
        - text: I have cramps in my lower belly.
          facts: {pregnant: true}
      no_fire:
        - text: I have stomach cramps after food.
          facts: {sex: male, age_years: 30}
      unknown:
        - text: I have pain in my lower belly.
          facts: {sex: female, age_years: 25}

  - id: gut.persistent_vomiting
    area: abdomen_gut
    level: urgent
    title: Vomiting that won't stop or prevents keeping fluids down
    fires:
      all:
        - text:
            - 'vomit\w*'
            - 'being sick'
            - 'throwing up'
            - 'threw up'
        - any:
            - text:
                - '(?:can''?t|cannot|unable to) keep (?:anything|fluids|water|food|drinks) down'
            - text:
                - '(?:for|over|more than) (?:2|two|3|three|24|48) (?:days|hours)'
                - '(?:won''?t|will not|does ?n''?t) stop'
    rule_out_question: Have you been vomiting for more than 2 days, or are you unable to keep fluids down?
    sources: [nhs_vomiting_adults, nhs_dehydration]
    examples:
      fires:
        - text: I have been vomiting for 2 days and can't keep water down.
      no_fire:
        - text: I vomited once this morning and now I am drinking normally.

  - id: gut.jaundice
    area: abdomen_gut
    level: urgent
    title: Yellowing of the skin or the whites of the eyes (jaundice)
    fires:
      text:
        - yellow (?:skin|eyes)
        - (?:skin|eyes|whites of (?:my |the |his |her )?eyes) (?:are |is |look |looks |turned |going |have gone )?yellow\w*
        - jaundice\w*
    rule_out_question: Have your skin or the whites of your eyes turned yellow?
    sources: [nhs_jaundice]
    examples:
      fires:
        - text: The whites of my eyes look yellow.
      no_fire:
        - text: My skin is a bit dry in winter.

  # ---------------- Urinary and genital ----------------
  - id: uro.sudden_testicular_pain
    area: urinary_genital
    level: emergency
    title: Sudden or severe testicle pain
    fires:
      all:
        - text:
