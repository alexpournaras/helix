        - purple (?:spots|rash|blotches)
        - pin ?prick (?:spots|rash)
        - tiny red (?:spots|dots) (?:that )?(?:do ?n'?t|does ?n'?t) fade
    rule_out_question: If you press a clear glass on the rash, does it stay visible (not fade)?
