# MeSH tree-number prefix → Helix body system (PLAN B0, 1A.9). Longest matching prefix wins for each tree
# number; a descriptor's systems are the union over all its tree numbers. `null` means "no system" (the tree
# is ignored, e.g. physiology or psychology branches that would otherwise add noise).
# Draft from spike X8 (2026-11-23), built from live MeSH tree numbers. Needs human review (PLAN Part G.6).
version: 1
systems:
  ent: Ear, nose and throat
  neurology: Brain and nerves
  cardiovascular: Heart and circulation
  respiratory: Lungs and breathing
  digestive: Digestive system and liver
  mouth_dental: Mouth and teeth
  musculoskeletal: Muscles, bones and joints
  skin: Skin, hair and nails
  urogenital: Kidneys, bladder and male genital
  female_reproductive: Female reproductive system
  pregnancy: Pregnancy and postpartum
  eye: Eye and vision
  endocrine_metabolic: Hormones and metabolism
  hematology: Blood
  immunology_allergy: Immune system and allergy
  infection: Infections
  oncology: Cancer
  mental_health: Mental health
  congenital_neonatal: Congenital and newborn
  injury_poisoning: Injury and poisoning
  general: General symptoms
