            - 'testes'
            - 'testis'
            - 'scrot\w*'
            - '(?:pain|hurts?) in (?:my |his )?balls'
            - '(?:my |his )?balls (?:hurt|are (?:painful|swollen))'
        - text:
            - 'sudden\w*'
            - 'severe'
            - 'came on (?:quickly|suddenly|fast)'
            - 'excruciating'
            - 'unbearable'
            - 'agony'
    rule_out_question: Did the testicle pain come on suddenly or is it severe?
    sources: [nhs_testicle_pain]
    examples:
      fires:
        - text: I have sudden severe pain in my left testicle.
      no_fire:
        - text: I noticed a small painless spot on my scrotum weeks ago.

  - id: uro.cannot_pass_urine
    area: urinary_genital
    level: emergency
    title: Unable to pass urine
    fires:
      text:
        - (?:can'?t|cannot|unable to|haven'?t been able to|not able to) (?:pee|wee|urinate|pass (?:any )?urine)
        - (?:haven'?t|hasn'?t|have not|has not|not) (?:peed|weed|urinated|passed (?:any )?urine) (?:for|since|in)
    rule_out_question: Are you unable to pass urine at all?
    sources: [nhs_enlarged_prostate, nhs_kidney_infection]
    examples:
