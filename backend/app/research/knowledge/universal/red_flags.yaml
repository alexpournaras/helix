    level: emergency
    title: Very high blood sugar with vomiting, confusion, drowsiness, deep or fast breathing, or ketones
    fires:
      all:
        - text:
            - 'blood sugars? (?:is |are |was |were )?(?:very |really )?high'
            - 'high blood sugar'
            - 'hyperglyc\w*'
            - '(?:sugar|glucose) (?:is |was )?(?:over |above )?(?:2\d|3\d)(?:\.\d)?'
            - '(?:sugar|glucose) (?:is |was )?(?:very )?high'
            - '(?:meter|monitor) (?:says|shows|reads) hi'
        - any:
            - mention:
                - 'vomit\w*'
                - 'being sick'
                - 'throwing up'
            - mention: *CONFUSION
            - mention:
                - 'drowsy'
                - 'sleepy'
                - 'hard to wake'
            - mention:
                - 'breathing (?:fast|deep\w*|heav\w*)'
                - 'fruity'
                - 'ketones?'
            - mention: *ABDO
    unknown: hyperglycaemia_features
    rule_out_question: With the high sugar, is there vomiting, stomach pain, confusion, drowsiness, fast or deep breathing, or high ketones?
    sources: [nhs_hyperglycaemia, nhs_dka, nice_ng17_type1_diabetes]
    examples:
      fires:
        - text: My blood sugar is very high and I am vomiting.
      no_fire:
        - text: My blood sugar was a bit high after a party, now normal.
      unknown:
        - text: My blood sugar is very high today.

  - id: meta.severe_low_blood_sugar
    area: hormones_metabolism
    level: emergency
    title: Low blood sugar with confusion, drowsiness, unconsciousness or a fit
    fires:
      all:
        - text:
            - 'low blood sugar'
            - 'hypos?'
            - 'hypoglyc\w*'
            - 'blood sugars? (?:is |are |was |were |dropped |went )?(?:very |really |too )?low'
            - '(?:sugar|glucose) (?:is |was |dropped to |fell to |of )?[0-3](?:\.\d)? ?(?:mmol)?'
        - any:
            - mention: *CONFUSION
            - mention:
                - 'drowsy'
                - '(?:passed|passing) out'
                - 'unconscious'
                - 'fits?'
                - 'seizure'
                - '(?:not|isn''?t) responding'
                - '(?:can''?t|won''?t) (?:be woken|wake)'
    unknown: hypoglycaemia_severity
    rule_out_question: With the low sugar, is the person confused, very drowsy, unconscious or having a fit?
    sources: [nhs_hypoglycaemia]
    examples:
      fires:
        - text: His blood sugar is very low and he is confused.
      no_fire:
        - text: I had a mild hypo, ate some sweets and feel fine. Not confused, not drowsy.
      unknown:
        - text: I keep having hypos this week.

  # ---------------- Mental health ----------------
  - id: mh.suicide_or_self_harm
    area: mental_health
    level: emergency
    crisis: true
    title: Thoughts of suicide or self-harm
    fires:
      text:
        - suicid\w*
        - kill\w* (?:my ?self|me)
        - end (?:my|it all|my own) life
        - end it all
        - take my (?:own )?life
        - (?:do ?n'?t|do not) want to (?:live|be alive|be here|wake up)
        - better off dead
        - (?:want|wanted|wanting) to die
        - self[- ]?harm\w*
        - (?:hurt|hurting|cut|cutting|harm|harming|burn|burning) my ?self
        - no (?:reason|point) (?:to|in) (?:live|living|go on|going on)
    rule_out_question: Are you having thoughts of ending your life or harming yourself?
    sources: [nhs_suicidal_thoughts, nhs_mental_health_emergency, nice_ng225_self_harm]
    examples:
      fires:
        - text: Lately I feel like I would be better off dead.
        - text: I have been cutting myself again.
        - text: I'm not sure, but I want to die.
      no_fire:
        - text: I don't want to die, I just want to sleep better.
        - text: I am not suicidal and I have never harmed myself.

  - id: mh.risk_to_others
    area: mental_health
    level: emergency
    title: Thoughts of harming someone else
    fires:
      text:
        - (?:hurt|harm|kill|attack) (?:someone|somebody|others|other people|people|him|her|them|my (?:wife|husband|partner|child|children|kids|mother|father|mum|dad))
        - violent (?:thoughts|urges) (?:towards|toward|about) (?:others|someone|people|my)
    rule_out_question: Are you having thoughts of harming anyone else?
    sources: [nhs_mental_health_emergency, nice_ng10_violence]
    examples:
      fires:
        - text: I have thoughts that I might hurt someone.
      no_fire:
        - text: I would never hurt anyone, I just feel low.

  - id: mh.psychosis_or_severe_agitation
    area: mental_health
    level: emergency
    title: Possible psychosis (hearing voices, seeing things, believing people are after them) or severe agitation
    fires:
      text:
        - hearing voices
        - voices (?:are )?(?:telling|tell|talking to) (?:me|him|her)
        - (?:seeing|see) things (?:that )?(?:are ?n'?t|others (?:can'?t|cannot) see)
        - hallucinat\w*
        - (?:people|someone|they) (?:are )?(?:watching|following|after|spying on|controlling) (?:me|him|her)
        - severe(?:ly)? agitat\w*
        - out of control
    rule_out_question: Is the person hearing or seeing things others don't, believing others are out to harm them, or so agitated they may be unsafe?
    sources: [nhs_psychosis, nhs_mental_health_emergency]
    examples:
      fires:
        - text: My brother is hearing voices telling him to do things.
      no_fire:
        - text: I talk to myself when I study, it helps me focus.

  - id: mh.eating_disorder_physical_danger
    area: mental_health
    level: urgent
    title: Physical danger signs with an eating disorder (fainting, chest pain, palpitations, very low weight)
    fires:
      all:
        - text:
            - 'eating disorder'
            - 'anorexi\w*'
            - 'bulimi\w*'
            - 'not eating'
            - 'starv\w*'
            - 'making (?:my ?self|herself|himself) (?:sick|vomit)'
            - 'purg\w*'
            - 'binge\w*'
        - text:
            - 'faint\w*'
            - 'dizzy'
            - 'chest pain'
            - 'palpitation\w*'
            - 'heart (?:racing|skipping|irregular|fluttering)'
            - 'very weak'
            - '(?:bmi|BMI) (?:of |is |under |below )?1[0-6]'
            - 'lost (?:a lot of|so much) weight'
    rule_out_question: With the eating problems, have there been fainting, dizziness, chest pain, a racing or irregular heartbeat, or very fast weight loss?
    sources: [nice_ng69_eating_disorders]
    examples:
      fires:
        - text: I have anorexia and I fainted twice this week.
      no_fire:
        - text: I skip breakfast sometimes because I am busy.

  # ---------------- Poisoning and injury ----------------
  - id: inj.poisoning_or_overdose
    area: poisoning_injury
    level: emergency
    title: Poisoning or overdose
    fires:
      text:
        - overdos\w*
        - took (?:too many|a lot of|all (?:my|the|of my)|loads of|lots of) (?:pills|tablets|medicines?|painkillers)
        - swallowed (?:a |an |some )?(?:bleach|poison|chemicals?|batter(?:y|ies)|button batter\w*|cleaning \w+|antifreeze|a magnet|magnets)
        - (?<!food )poison(?:ed|ing|ous)?
        - drank (?:some |a lot of |the )?(?:bleach|antifreeze|chemicals?|cleaning \w+|weed ?killer)
        - (?:ate|eaten|swallowed) (?:some |his |her |my |the )?(?:pills|tablets|medicines?)
        - '(?:swallowed|ate|eaten|got into)\W+(?:\w+\W+){0,4}(?:pills|tablets|medicines?|medication|capsules)'
    rule_out_question: Has anyone swallowed, inhaled or taken too much of a medicine, chemical or other substance?
    sources: [nhs_poisoning]
    examples:
      fires:
        - text: My toddler swallowed a button battery.
        - text: I took too many tablets an hour ago.
      no_fire:
        - text: I think I have food poisoning from last night's dinner.

  - id: inj.head_injury_red_features
    area: poisoning_injury
    level: emergency
    title: Head injury with vomiting, confusion, drowsiness, memory loss, a fit or loss of consciousness
    fires:
      all:
        - text: *HEADHIT
        - any:
            - mention:
                - 'vomit\w*'
                - 'being sick'
                - 'threw up'
                - 'throwing up'
            - mention:
                - 'confus\w*'
                - 'drowsy'
                - 'knocked out'
                - '(?:lost|loss of) consciousness'
                - 'passed out'
                - 'blacked out'
                - '(?:can''?t|cannot|does ?n''?t) remember'
                - 'memory loss'
                - 'fits?'
                - 'seizure'
    unknown: head_injury_features
    rule_out_question: Since the head injury, has there been vomiting, confusion, drowsiness, memory loss, a fit, or any loss of consciousness?
    sources: [nhs_head_injury, nice_ng232_head_injury]
    examples:
      fires:
        - text: He hit his head and has vomited twice since.
      no_fire:
        - text: I bumped my head on a cupboard. No vomiting, not confused, not drowsy, I remember everything and didn't pass out.
      unknown:
        - text: I banged my head on a door this morning.

  - id: inj.major_trauma_or_bleeding
    area: poisoning_injury
    level: emergency
    title: Major trauma or heavy bleeding
    fires:
      text:
        - car (?:crash|accident)
        - hit by a (?:car|vehicle|bus|lorry|truck|bike)
        - fell (?:from|off) (?:a )?(?:height|ladder|roof|balcony|scaffold\w*)
        - stab(?:bed|bing)
        - (?:was|been|got) shot
        - gunshot
        - heavy bleeding
        - bleeding (?:heavily|a lot|badly)
        - (?:bleeding )?(?:won'?t|will not|does ?n'?t) stop bleeding
        - (?:can'?t|cannot) stop the bleeding
        - bone (?:is )?sticking out
        - (?:large|big|severe|deep) burn
        - (?:electric|electrical) (?:shock|burn)
    rule_out_question: Has there been a serious accident, heavy bleeding that won't stop, a large burn, or a bone sticking out?
    sources: [nhs_burns, nhs_head_injury]
    examples:
      fires:
        - text: He fell off a ladder and the bleeding won't stop.
      no_fire:
        - text: I had my flu shot yesterday and my arm is sore.

  # ---------------- Pregnancy ----------------
  - id: preg.bleeding
    area: pregnancy
    level: emergency
    population: pregnancy
    title: Vaginal bleeding in pregnancy
    fires:
      text:
        - bleed\w*
        - spotting
        - blood (?:from|in) (?:my |the )?(?:vagina|underwear|pants|knickers)
        - passing (?:blood|clots)
        - blood when I wipe
    unknown: pregnant
    rule_out_question: Are you pregnant, and is there any bleeding from the vagina?
    sources: [nhs_pregnancy_bleeding, nice_ng126_ectopic]
    examples:
      fires:
        - text: I am 10 weeks pregnant and have some bleeding.
          facts: {pregnant: true}
      no_fire:
        - text: Some spotting between periods.
          facts: {pregnant: false}
        - text: No bleeding at all.
          facts: {pregnant: true}
      unknown:
        - text: I have spotting today.
          facts: {sex: female, age_years: 30}

  - id: preg.pre_eclampsia_signs
    area: pregnancy
    level: emergency
    population: pregnancy
    title: Severe headache, vision problems, pain below the ribs or sudden swelling in pregnancy (pre-eclampsia)
    fires:
      any:
        - all:
            - text:
                - 'headaches?'
                - 'head (?:pain|ache)'
            - text:
                - 'severe'
                - 'bad'
                - 'terrible'
                - '(?:won''?t|does ?n''?t|will not) go away'
                - 'worst'
        - text:
            - 'blurr\w* vision'
            - 'vision (?:is )?blurr\w*'
            - 'flashing lights'
            - 'seeing (?:spots|stars|flashes)'
            - 'zig ?zag\w*'
        - text:
            - 'pain (?:just )?(?:below|under) (?:my |the )?ribs'
        - text:
            - 'sudden\w* swelling'
            - '(?:face|hands|feet) (?:are |is )?sudden\w* (?:swollen|puffy)'
    unknown: pregnant
    rule_out_question: In this pregnancy, do you have a severe headache, blurred vision or flashing lights, pain just below the ribs, or sudden swelling of the face, hands or feet?
    sources: [nhs_pre_eclampsia, nice_ng133_hypertension_pregnancy]
    examples:
      fires:
        - text: I am 34 weeks pregnant with a severe headache and blurred vision.
          facts: {pregnant: true}
      no_fire:
        - text: Mild backache in the evenings.
          facts: {pregnant: true}

  - id: preg.reduced_fetal_movements
    area: pregnancy
    level: emergency
    population: pregnancy
    title: The baby is moving less, or has stopped moving
    fires:
      text:
        - (?:baby|babies|baby'?s) (?:is |has been |seems )?(?:moving )?(?:less|much less|quieter)
        - (?:baby|baby'?s) (?:has |have )?(?:stopped|stopping) (?:moving|kicking)
        - (?:baby|it) (?:is ?n'?t|is not|has ?n'?t|has not|has ?n'?t been|is not) (?:moving|kicking)
        - (?:fewer|reduced|less|decreased|no) (?:fetal |foetal |baby )?movements?
        - (?:haven'?t|have not|not) felt (?:the |my )?baby (?:move|kick|moving|kicking)
    unknown: pregnant
    rule_out_question: Is your baby moving less than usual, or have the movements stopped?
    sources: [nhs_baby_movements, nice_ng201_antenatal]
    examples:
      fires:
        - text: The baby has been moving less since yesterday.
          facts: {pregnant: true, weeks_pregnant: 32}
        - text: I haven't felt the baby kick today.
          facts: {pregnant: true}
      no_fire:
        - text: The baby is kicking a lot tonight.
          facts: {pregnant: true}

  - id: preg.waters_breaking_early
    area: pregnancy
    level: emergency
    population: pregnancy
    title: Waters breaking before 37 weeks
    fires:
      all:
        - text:
            - 'waters\W+(?:\w+\W+){0,2}(?:broken|broke|breaking|went|gone)'
            - 'leak\w* (?:fluid|water)'
            - 'gush of (?:fluid|water)'
            - 'fluid (?:leaking|coming) (?:out )?(?:from|of) (?:my |the )?vagina'
        - any:
            - fact: weeks_pregnant
              lt: 37
            - text:
                - 'before 37 weeks'
                - 'premature'
                - 'preterm'
                - '(?:too )?early'
                - '(?:2\d|3[0-6]) weeks'
    unknown: weeks_pregnant
    rule_out_question: How many weeks pregnant are you? Is it before 37 weeks?
    sources: [nhs_waters_breaking]
    examples:
      fires:
        - text: I think my waters have broken.
          facts: {pregnant: true, weeks_pregnant: 33}
      no_fire:
        - text: I think my waters have broken.
          facts: {pregnant: true, weeks_pregnant: 39}
      unknown:
        - text: I think my waters have broken.
          facts: {pregnant: true}

  # ---------------- Children ----------------
  - id: child.floppy_or_unresponsive_infant
    area: children
    level: emergency
    population: infant
    title: A floppy, unresponsive or very drowsy baby, a weak or high-pitched cry, or blue skin
    fires:
      text:
        - floppy
        - limp
        - lethargic
        - unresponsive
        - hard to wake
        - '(?:won''?t|will not|does ?n''?t|is not|isn''?t) wak(?:e|ing)(?: up)?'
        - very (?:sleepy|drowsy)
        - weak cry
        - high[- ]pitched (?:cry|crying|scream\w*)
        - blue (?:lips|tongue|skin)
        - (?:lips|tongue|skin) (?:is |are |looks? )?blue
    unknown: age_months
    rule_out_question: Is the baby floppy, very drowsy or hard to wake, crying weakly or in a high-pitched way, or turning blue?
    sources: [nice_ng143_fever_under5, nhs_fever_children]
    examples:
      fires:
        - text: My baby is floppy and hard to wake.
          facts: {age_months: 4}
      no_fire:
        - text: My baby is alert, feeding well and smiling.
          facts: {age_months: 4}
      unknown:
        - text: The baby seems very sleepy today.

  - id: child.dehydration
    area: children
    level: emergency
    population: child
    title: Signs of dehydration in a child (no wet nappies, sunken eyes or soft spot, no tears, not drinking)
    fires:
      text:
        - sunken (?:eyes|fontanelle|soft spot)
        - no wet (?:nappies|nappy|diapers?)
        - (?:has ?n'?t|has not|not) (?:had )?(?:a )?wet (?:nappy|nappies|diaper)
        - (?:has ?n'?t|has not|not) (?:peed|weed|urinated) (?:for|in|since)
        - 'no tears(?: when crying)?'
        - (?:not|is ?n'?t|won'?t) drinking (?:anything|at all)
    unknown: age_years
    rule_out_question: Has the child had fewer wet nappies or not passed urine for 12 hours, no tears, sunken eyes, or stopped drinking?
    sources: [nhs_dehydration, nice_ng143_fever_under5]
    examples:
      fires:
        - text: She hasn't had a wet nappy since this morning and has no tears when crying.
          facts: {age_years: 1}
      no_fire:
        - text: He is drinking well and has plenty of wet nappies.
          facts: {age_years: 1}

  - id: child.breathing_difficulty
    area: children
    level: emergency
    population: child
    title: A child with difficulty breathing (working hard, ribs sucking in, grunting, very fast breathing, pauses)
    fires:
      text:
        - struggling to breathe
        - working (?:very )?hard to breathe
        - (?:ribs|chest|tummy|skin) (?:is |are )?(?:sucking|pulling) in
        - sucking in (?:under|between) (?:the |his |her )?ribs
        - grunting
        - (?:flaring (?:nostrils|nose)|nostrils (?:are )?flar\w*)
        - breathing (?:very )?(?:fast|quickly)
        - fast breathing
        - pauses in (?:his|her|their) breathing
        - stops? breathing
        - can'?t breathe
    unknown: age_years
    rule_out_question: Is the child struggling to breathe, breathing very fast, grunting, or are the ribs sucking in with each breath?
    sources: [nice_ng143_fever_under5, nhs_croup]
    examples:
      fires:
        - text: My son is breathing very fast and his ribs are sucking in.
          facts: {age_years: 2}
      no_fire:
        - text: He has a runny nose but breathes normally.
          facts: {age_years: 2}

  # ---------------- Older adults ----------------
  - id: older.sudden_confusion
    area: older_adults
    level: emergency
    population: older
    title: Sudden confusion in an older person (possible delirium)
    fires:
      text: *CONFUSION
    unknown: age_years
    rule_out_question: Has the person become confused suddenly, over hours or days?
    sources: [nhs_confusion, nice_cg103_delirium]
    examples:
      fires:
        - text: My mother has suddenly become confused since yesterday.
          facts: {age_years: 82}
      no_fire:
        - text: My grandfather is sharp and not confused at all.
          facts: {age_years: 84}

  - id: older.fall_with_head_strike_on_anticoagulants
    area: older_adults
    level: emergency
    title: A fall or head injury while taking blood thinners
    fires:
      all:
        - text: *HEADHIT
        - any:
            - fact: on_anticoagulants
              eq: true
            - text:
                - 'blood thinners?'
                - 'anticoagulant\w*'
                - 'warfarin'
                - 'apixaban'
                - 'rivaroxaban'
                - 'edoxaban'
                - 'dabigatran'
    unknown: on_anticoagulants
    rule_out_question: Does the person take blood-thinning medicine (anticoagulants such as warfarin, apixaban or rivaroxaban)?
    sources: [nice_ng232_head_injury, nhs_falls, nice_ng249_falls]
    examples:
      fires:
        - text: My father fell and hit his head. He takes warfarin.
        - text: She fell and hit her head.
          facts: {on_anticoagulants: true}
      no_fire:
        - text: She fell and hit her head.
          facts: {on_anticoagulants: false}
      unknown:
        - text: Grandad fell and banged his head on the floor.

  # ---------------- Possible cancer (NICE NG12) ----------------
  - id: cancer.unexplained_weight_loss
    area: possible_cancer
    level: urgent
    title: Unexplained weight loss
    fires:
      text:
        - (?:lost|losing) (?:a lot of |some |\d+ ?(?:kg|kilos|pounds|lbs|stone) of )?weight (?:without (?:trying|dieting|meaning to)|for no (?:reason|obvious reason))
        - unexplained weight loss
        - weight loss (?:without|for no) (?:trying|reason|obvious reason)
        - unintentional weight loss
        - (?:clothes|trousers) (?:are |have become )?(?:getting )?(?:loose|looser)
    rule_out_question: Have you lost weight without trying?
    sources: [nice_ng12_cancer, nhs_weight_loss]
    examples:
      fires:
        - text: I have lost 6 kg of weight without trying over three months.
      no_fire:
        - text: I lost weight on purpose by dieting.

  - id: cancer.new_lump
    area: possible_cancer
    level: urgent
    title: A new lump, or a lump that is growing
    fires:
      text:
        - new lump
        - (?:found|noticed|feel|felt|have) a (?:hard |small |new )?lump
        - lump (?:in|on) (?:my |the |his |her )?(?:breast|neck|armpit|groin|testicle|testicles|throat)
        - lump (?:that )?(?:is )?(?:getting bigger|growing|won'?t go away)
        - (?:swelling|lump) that (?:won'?t|will not|does ?n'?t) go (?:away|down)
    rule_out_question: Have you noticed a new lump, or one that is growing?
    sources: [nice_ng12_cancer, nhs_lumps, nhs_breast_lump]
    examples:
      fires:
        - text: I found a lump in my breast last week.
      no_fire:
        - text: The swelling on my ankle went down after a day.

  - id: cancer.rectal_bleeding_with_bowel_change
    area: possible_cancer
    level: urgent
    title: Blood in the stool with a change in bowel habit or weight loss
    fires:
      all:
        - text:
            - 'blood (?:in|on) (?:my |the )?(?:poo|poos|stool|stools|toilet paper)'
            - 'bleeding from (?:my |the )?(?:bottom|back passage|rectum|anus)'
            - 'rectal bleeding'
            - 'bloody (?:poo|stool|stools)'
        - any:
            - mention:
                - 'chang\w* (?:in )?(?:my )?bowel (?:habits?|movements)'
                - 'looser (?:poo|stools?)'
                - 'diarrho?ea'
                - 'more often'
                - 'constipat\w*'
            - mention:
                - '(?:for|over) (?:\d+|three|four|six|several) weeks'
                - 'weight loss'
                - 'lost weight'
    unknown: bowel_habit_change
    rule_out_question: Along with the blood, has your bowel habit changed (looser, more often or constipation) for several weeks, or have you lost weight?
    sources: [nice_ng12_cancer, nhs_bowel_cancer_symptoms, nhs_rectal_bleeding]
    examples:
      fires:
        - text: Blood in my poo and my stools have been looser for six weeks.
      no_fire:
        - text: Bright blood on the toilet paper once after straining. No change in my bowel habit. No weight loss.
      unknown:
        - text: I noticed blood in my stool yesterday.

  - id: cancer.postmenopausal_bleeding
    area: possible_cancer
    level: urgent
    title: Vaginal bleeding after the menopause
    fires:
      any:
        - text:
            - 'post[- ]?menopausal bleeding'
            - 'bleeding after (?:the |my )?menopause'
        - all:
            - text:
                - 'vaginal bleeding'
                - 'bleeding from (?:my |the )?vagina'
                - 'spotting'
                - 'blood (?:in|on) (?:my )?(?:underwear|pants|knickers)'
            - any:
                - fact: postmenopausal
                  eq: true
                - text:
                    - 'menopaus\w*'
                    - 'periods stopped'
                    - '(?:have ?n''?t|have not) had a period (?:for|in) (?:a year|years|over|more than)'
    unknown: postmenopausal
    rule_out_question: Have your periods stopped for more than a year (after the menopause)?
    sources: [nice_ng12_cancer, nhs_postmenopausal_bleeding]
    examples:
      fires:
        - text: I have some spotting and I went through the menopause five years ago.
        - text: I noticed vaginal bleeding.
          facts: {postmenopausal: true}
      no_fire:
        - text: Some spotting between periods this month.
          facts: {postmenopausal: false}
      unknown:
        - text: I noticed vaginal bleeding.
          facts: {sex: female, age_years: 55}

  - id: cancer.persistent_hoarseness_or_swallowing
    area: possible_cancer
    level: urgent
    title: Persistent hoarseness, or difficulty swallowing
    fires:
      text:
        - 'hoarse\w* (?:voice )?(?:for|over|more than) (?:3|three|4|four|several|\d+) weeks'
        - 'voice (?:has been|is) hoarse (?:for|over)'
        - (?:difficulty|trouble|problems?) swallowing
        - food (?:gets|getting|keeps getting) stuck
        - (?:can'?t|cannot) swallow (?:food|properly|solids)
        - dysphagia
    rule_out_question: Has your voice been hoarse for more than 3 weeks, or is food getting stuck when you swallow?
    sources: [nice_ng12_cancer, nhs_swallowing_problems, nhs_laryngitis]
    examples:
      fires:
        - text: Food keeps getting stuck when I swallow.
        - text: I have had a hoarse voice for 5 weeks.
      no_fire:
        - text: My voice was hoarse for two days with a cold.
